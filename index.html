<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariage de Jean-Christophe & Charlotte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #738687;
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        
        .invitation-container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            padding: 3.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.03);
            margin: 2rem 0;
        }
        
        .header .subtitle {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            opacity: 0.8;
        }
        
        /* Style regroupé pour réduire l'espace des prénoms et du & */
        .couple-names {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 300;
            margin: 1.5rem 0;
            letter-spacing: 0.05em;
            line-height: 1.1;
        }

        .couple-names .ampersand {
            display: block;
            font-size: 2.2rem;
            margin: 0.15rem 0;
            opacity: 0.85;
        }
        
        .date-badge {
            font-size: 0.95rem;
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .intro-text {
            font-size: 1.05rem;
            line-height: 1.8;
            max-width: 480px;
            margin: 0 auto 3rem auto;
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
            opacity: 0.95;
        }
        
        .event-info {
            display: flex;
            justify-content: space-around;
            gap: 2rem;
            margin-bottom: 3.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2.5rem 0;
        }
        
        .info-block {
            flex: 1;
        }
        
        .info-block h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            margin-bottom: 0.75rem;
            opacity: 0.8;
        }
        
        .info-block p {
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
            font-weight: 400;
        }
        
        .info-block .location {
            font-size: 0.95rem;
            opacity: 0.85;
            font-weight: 300;
        }

        /* Style des blocs QR Codes / Images SVG */
        .qr-section {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .qr-card {
            text-align: center;
            flex: 1;
            min-width: 130px;
            max-width: 160px;
        }

        .qr-card img {
            width: 105px;
            height: 105px;
            background-color: #FFFFFF;
            padding: 7px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: block;
            margin: 0 auto 0.75rem auto;
            transition: opacity 0.3s ease;
        }

        .qr-card img:hover {
            opacity: 0.85;
        }

        .qr-card span {
            color: #FFFFFF;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-size: 0.7rem;
            opacity: 0.9;
            display: block;
        }
        
        @media (max-width: 600px) {
            .event-info {
                flex-direction: column;
                gap: 2rem;
            }
            .couple-names {
                font-size: 2.8rem;
            }
            .invitation-container {
                padding: 2rem 1rem;
                border: none;
            }
            .qr-section {
                gap: 1.5rem;
            }
        }
    </style>
</head>

<body class="p-4 sm:p-8">

    <main class="invitation-container">

        <header class="header">
            <span class="subtitle">Nous nous unissons</span>
            <h1 class="couple-names">
                Jean-Christophe
                <span class="ampersand">&</span>
                Charlotte
            </h1>
            <div class="date-badge">17 . 10 . 2026</div>
        </header>

        <section class="details">
            <p class="intro-text">
                C'est avec beaucoup de joie que nous vous invitons à célébrer notre mariage. Votre présence rendra cette journée inoubliable.
            </p>

            <div class="event-info">
                <div class="info-block">
                    <h2>Cérémonie</h2>
                    <p>14h30</p>
                    <p class="location">Mairie de Châtillon</p>
                </div>

                <div class="info-block">
                    <h2>Réception</h2>
                    <p>15h30</p>
                    <p class="location">Le CAM<br>Montrouge</p>
                </div>
            </div>

            <!-- Section QR Codes SVG -->
            <div class="qr-section">
                <div class="qr-card">
                    <a href="http://mariage.champarnaud.fr/whoswho.pdf" target="_blank" rel="noopener noreferrer">
                        <img src="http://mariage.champarnaud.fr/qrcode-whoswho.svg" alt="QR Code Who's Who">
                    </a>
                    <span>Who's Who</span>
                </div>
                <div class="qr-card">
                    <a href="https://www.onparticipe.fr/c/sSvOza7h" target="_blank" rel="noopener noreferrer">
                        <img src="http://mariage.champarnaud.fr/qrcode-cadeau.svg" alt="QR Code Cadeau">
                    </a>
                    <span>Cadeau</span>
                </div>
                <div class="qr-card">
                    <a href="http://mariage.champarnaud.fr/plandetable.pdf" target="_blank" rel="noopener noreferrer">
                        <img src="http://mariage.champarnaud.fr/qrcode-tables.svg" alt="QR Code Plan de table">
                    </a>
                    <span>Plan de table</span>
                </div>
            </div>
        </section>

    </main>

</body>

</html>
